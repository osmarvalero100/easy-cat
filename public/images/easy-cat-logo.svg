<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Gradient: Rich Espresso to Deep Amber -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#5c2409" />
      <stop offset="60%" stop-color="#381504" />
      <stop offset="100%" stop-color="#1c0a02" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Light Gold Gradient for Pages -->
    <linearGradient id="pageGradLeft" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="70%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="pageGradRight" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="70%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <!-- Soft Drop Shadow for Emblem -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Circular Seal -->
  <circle cx="250" cy="250" r="236" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4.5" filter="url(#shadow)" />

  <!-- Concentric Luxury Rings -->
  <circle cx="250" cy="250" r="224" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.65" />
  <circle cx="250" cy="250" r="217" fill="none" stroke="#fbbf24" stroke-width="0.8" opacity="0.4" />

  <!-- Stars / Ornamental Accents -->
  <polygon points="250,52 253,60 262,60 255,65 258,74 250,68 242,74 245,65 238,60 247,60" fill="url(#goldGrad)" />
  <circle cx="100" cy="250" r="2.5" fill="#f59e0b" opacity="0.8" />
  <circle cx="400" cy="250" r="2.5" fill="#f59e0b" opacity="0.8" />

  <!-- Central Icon: Editorial Book + Cat Silhouette Silhouette Emblem -->
  <g transform="translate(0, -10)">
    <!-- Cat Ears / Editorial Crown atop the Book -->
    <!-- Left Ear -->
    <path d="M 215 142 L 195 98 C 205 108, 222 125, 230 137 Z" fill="url(#goldGrad)" />
    <!-- Right Ear -->
    <path d="M 285 142 L 305 98 C 295 108, 278 125, 270 137 Z" fill="url(#goldGrad)" />

    <!-- Head Arch / Spine Crown -->
    <path d="M 225 139 C 238 132, 262 132, 275 139 C 265 146, 235 146, 225 139 Z" fill="#fbbf24" opacity="0.9" />

    <!-- Subtle Whiskers Accent (Delicate Editorial Geometry) -->
    <path d="M 185 135 L 155 130" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 183 143 L 150 144" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 315 135 L 345 130" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 317 143 L 350 144" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- Open Book Pages - Outer Layer (Gold Leaf) -->
    <!-- Left Base Page -->
    <path d="M 248 152 C 205 138, 150 144, 118 162 C 114 164, 112 168, 112 173 L 112 245 C 112 250, 116 254, 121 252 C 152 236, 205 232, 248 248 Z"
          fill="#92400e" opacity="0.7" />
    <!-- Right Base Page -->
    <path d="M 252 152 C 295 138, 350 144, 382 162 C 386 164, 388 168, 388 173 L 388 245 C 388 250, 384 254, 379 252 C 348 236, 295 232, 252 248 Z"
          fill="#92400e" opacity="0.7" />

    <!-- Open Book Pages - Main Illuminated Pages -->
    <!-- Left Main Page -->
    <path d="M 247 156 C 208 142, 155 148, 124 165 C 120 167, 118 171, 118 175 L 118 242 C 118 247, 122 250, 127 248 C 156 233, 206 229, 247 244 Z"
          fill="url(#pageGradLeft)" />
    <!-- Right Main Page -->
    <path d="M 253 156 C 292 142, 345 148, 376 165 C 380 167, 382 171, 382 175 L 382 242 C 382 247, 378 250, 373 248 C 344 233, 294 229, 253 244 Z"
          fill="url(#pageGradRight)" />

    <!-- Interior Page Text Lines (Vector Editorial Layout Simulation) -->
    <line x1="140" y1="180" x2="225" y2="173" stroke="#b45309" stroke-width="2" opacity="0.4" stroke-linecap="round" />
    <line x1="140" y1="192" x2="228" y2="185" stroke="#b45309" stroke-width="2" opacity="0.4" stroke-linecap="round" />
    <line x1="140" y1="204" x2="220" y2="197" stroke="#b45309" stroke-width="2" opacity="0.4" stroke-linecap="round" />
    <line x1="140" y1="216" x2="210" y2="209" stroke="#b45309" stroke-width="2" opacity="0.4" stroke-linecap="round" />

    <line x1="360" y1="180" x2="275" y2="173" stroke="#b45309" stroke-width="2" opacity="0.4" stroke-linecap="round" />
    <line x1="360" y1="192" x2="272" y2="185" stroke="#b45309" stroke-width="2" opacity="0.4" stroke-linecap="round" />
    <line x1="360" y1="204" x2="280" y2="197" stroke="#b45309" stroke-width="2" opacity="0.4" stroke-linecap="round" />
    <line x1="360" y1="216" x2="290" y2="209" stroke="#b45309" stroke-width="2" opacity="0.4" stroke-linecap="round" />

    <!-- Center Book Spine & Golden Ribbon Bookmark -->
    <path d="M 248 154 L 252 154 L 252 265 L 248 265 Z" fill="#92400e" />
    <path d="M 249 155 L 251 155 L 251 280 L 255 273 L 259 280 L 259 155 Z" fill="url(#goldGrad)" opacity="0.9" />
  </g>

  <!-- Typography: EASY CAT -->
  <text x="250" y="330"
        text-anchor="middle"
        font-family="'Playfair Display', 'Cinzel', 'Times New Roman', Georgia, serif"
        font-size="44"
        font-weight="900"
        letter-spacing="5"
        fill="#ffffff">
    EASY CAT
  </text>

  <!-- Ornamental Divider with Central Diamond -->
  <g transform="translate(0, 10)">
    <line x1="140" y1="352" x2="230" y2="352" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
    <polygon points="250,347 255,352 250,357 245,352" fill="#fbbf24" />
    <line x1="270" y1="352" x2="360" y2="352" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Subtitle: EDITORIAL -->
  <text x="250" y="388"
        text-anchor="middle"
        font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif"
        font-size="16"
        font-weight="700"
        letter-spacing="9"
        fill="#fbbf24">
    EDITORIAL
  </text>

  <!-- Bottom Arch / Tagline -->
  <text x="250" y="420"
        text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="10"
        font-weight="600"
        letter-spacing="3"
        fill="#fed7aa"
        opacity="0.8">
    GENERADOR DE CATÁLOGOS
  </text>
</svg>
